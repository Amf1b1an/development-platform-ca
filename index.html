<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Post</title>
    <script type="module" src="/JS/posts.js"></script>
    <link rel="stylesheet" href="/dist/output.css" />
  </head>

  <body
    class="bg-gradient-to-r from-stone-700 via-orange-600 to-stone-700 min-h-screen h-auto flex flex-col items-center px-3 sm:px-0"
  >
    <div class="max-w-md w-full space-y-8 lg:pt-8 px-9 md:px-5 lg:px-3">
      <header
        class=" rounded py-3 mt-2"
      >
        <div>
            <p class="text-3xl font-bold flex justify-center">News</p>
        </div>
        <div id="auth-buttons" class="flex gap-4 justify-between px-3">
          <a
            id="login-btn"
            href="/HTML/login.html"
            class="text-sm bg-orange-700 text-black hover:underline font-medium p-2 rounded-xl hover:bg-orange-500 border-2"
          >
          Login
          </a>
          
          <a
            id="register-btn"
            href="/HTML/register.html"
            class="text-sm bg-orange-700 text-black hover:underline font-medium p-2 rounded-xl hover:bg-orange-500 border-2"
          >
          Register
          </a>
          
          <a 
            href="/HTML/create.html"
            id="create-btn"
            class="hidden text-sm bg-orange-700 text-black hover:underline font-medium p-2 rounded-xl hover:bg-orange-500 border-2"
          >
          Create
          </a>

          <button
            id="logout-btn"
            type="button"
            class="text-sm bg-orange-700 text-black hover:underline font-medium p-2 rounded-xl hover:bg-orange-500 border-2"
          >
            Logout
          </button>
        </div>
      
      </header>

        <div
          id="new-post-section"
          class="max-w-3xl w-full space-y-6 rounded-2xl hidden"
        >
          <main class=" flex items-center justify-center flex-col">
            <div class=" rounded  p-6 w-full max-w-3xl">
              <h1 class="text-xl font-bold text-gray-900 mb-4 flex justify-center">Posts</h1>
              <div id="message-container"></div>
              <div id="posts-list" class="space-y-4"></div>
            </div>
          </main>
        </div>
      </body>
</html>
